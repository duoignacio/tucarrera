<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tucarrera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
      <path d="M12 22C12 22 5 18 5 11C5 6 8 3 12 2C16 3 19 6 19 11C19 18 12 22 12 22Z" fill="#57C77E"/>
      <path d="M12 22V11" stroke="#14432B" stroke-width="1.4"/>
    </svg>
    <h1>tucarrera</h1>
  </header>

  <section id="pantalla-inicio">
    <h2>Encontrá tu camino</h2>
    <button id="boton-empezar">Empezar</button>
  </section>

  <section id="pantalla-quiz" class="oculto">
    <p id="contador">1/20</p>
    <h2 id="texto-pregunta"></h2>
    <div id="opciones"></div>
  </section>

  <section id="pantalla-resultado" class="oculto">
    <p class="etiqueta">Tu carrera es:</p>
    <h2 id="texto-resultado"></h2>
    <button id="boton-repetir">Repetir</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
